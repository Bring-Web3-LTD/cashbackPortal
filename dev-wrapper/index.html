<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Cashback Portal - dev wrapper</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header class="bar">
            <div class="bar-text">
                <h1>Cashback Portal: dev wrapper</h1>
                <p class="hint">
                    Simulates a partner page embedding the portal via the
                    <code>POST /v1/extension/check/portal</code> bootstrap call.
                </p>
            </div>
            <div class="view-toolbar">
                <select id="viewMode" title="View mode" aria-label="View mode">
                    <option value="desktop">Desktop</option>
                    <option value="mobile">Mobile</option>
                    <option value="responsive">Responsive</option>
                </select>
                <div class="tb-group" id="deviceRow">
                    <select id="devicePreset" title="Device preset (Mobile/Responsive modes)" aria-label="Device preset"></select>
                    <button id="rotateDevice" type="button" title="Rotate (swap width and height)" aria-label="Rotate stage">&#10561;</button>
                </div>
                <div class="tb-group" id="responsiveSize">
                    <input id="responsiveWidth" type="number" min="200" max="3840" step="1" title="Stage width (px, Responsive mode)" aria-label="Stage width in pixels" />
                    <span class="tb-x">&#215;</span>
                    <input id="responsiveHeight" type="number" min="200" max="2400" step="1" title="Stage height (px, Responsive mode)" aria-label="Stage height in pixels" />
                </div>
                <div class="tb-group" id="pageBgRow">
                    <input id="pageBgColor" type="color" title="Backdrop colour under the portal (shows wherever the portal page is transparent). Committing a colour switches a loaded image off." aria-label="Backdrop colour" />
                    <button id="pageBgImage" type="button" title="Backdrop image under the portal (e.g. a partner-site screenshot). Click: pick a file, or toggle a loaded image off/on · Shift+click: paste from clipboard (image or copied URL) · Alt+click: enter a URL · Ctrl+click: clear." aria-label="Backdrop image">&#128444;&#xFE0E;</button>
                    <button id="pageBgImageScope" type="button" title="Backdrop area: portal stage only &#8646; full wrapper" aria-label="Toggle backdrop area">&#9635;&#xFE0E;</button>
                    <button id="pageBgReset" type="button" title="Remove backdrop colour and image (the wrapper surround keeps its default grey hatch)" aria-label="Reset backdrop">&#8634;</button>
                    <input id="pageBgImageFile" type="file" accept="image/*" hidden />
                </div>
            </div>
            <div class="bar-actions">
                <button id="walletBtn" type="button" class="wallet-btn" data-state="disconnected">
                    Connect wallet
                </button>
                <button id="logoutBtn" type="button" class="logout-btn" title="Clear CloudFront basic-auth credentials" hidden>
                    Log out
                </button>
            </div>
        </header>

        <main class="layout" id="layout">
            <button id="toggleSidebar" class="toggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
                <span class="toggle-icon" aria-hidden="true">‹</span>
            </button>
            <aside class="controls">
                <div class="api-row">
                    <p class="api-info">API path: <code id="apiStageInfo">—</code></p>
                    <button id="refresh" type="button" class="secondary refresh-icon" aria-label="Refresh"
                        title="Re-run the check/portal bootstrap with the current params and wallet state">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="23 4 23 10 17 10" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                    </button>
                </div>

                <fieldset>
                    <legend>Bootstrap</legend>

                    <label>
                        <span>Theme</span>
                        <select id="theme">
                            <option value="">(unset)</option>
                            <option value="light">light</option>
                            <option value="dark">dark</option>
                        </select>
                    </label>

                    <label>
                        <span>Extension ID</span>
                        <input id="extensionId" type="text" />
                    </label>

                    <label>
                        <span>Style as</span>
                        <select id="styleAs">
                            <option value="">Platform</option>
                            <option value="DEFAULT">DEFAULT</option>
                        </select>
                    </label>

                    <label class="row">
                        <input id="statusPreview" type="checkbox" />
                        <span>Status modal preview</span>
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Wallet</legend>
                    <label>
                        <span>Wallet provider</span>
                        <select id="walletProvider">
                            <option value="mock">Mock (in-page)</option>
                            <option value="nightly">Nightly (Solana)</option>
                            <option value="solflare">Solflare (USDC)</option>
                            <option value="yoroi">Yoroi (Cardano)</option>
                            <option value="gero">Gero (Cardano)</option>
                            <option value="casper">Casper Wallet (CSPR)</option>
                            <option value="ecko">Ecko (Kadena, connect only)</option>
                            <option value="ready">Ready / Argent (Starknet, connect only)</option>
                        </select>
                    </label>
                    <label>
                        <span>Wallet address</span>
                        <input id="wallet" type="text" placeholder="0x… (leave empty for null)" />
                    </label>
                    <div class="row-split">
                        <label class="row">
                            <input id="startConnected" type="checkbox" />
                            <span>Start connected</span>
                        </label>
                        <button id="manualConnect" type="button" class="link-btn"
                            title="Manually run the wallet connect flow and push the session to the portal">Send connect</button>
                    </div>
                    <details class="debug">
                        <summary>Wallet identity (optional)<span id="identityDot" class="identity-dot"
                                title="A wallet identity value is set" hidden></span></summary>
                        <label>
                            <span>Wallet name</span>
                            <input id="walletName" type="text" placeholder="(optional, e.g. WalletName)" />
                        </label>
                        <label>
                            <span>Wallet emoji URL</span>
                            <input id="walletEmoji" type="text" placeholder="(optional, asset URL)" />
                        </label>
                        <label class="row">
                            <input id="identityStart" type="checkbox" />
                            <span>Start with this identity</span>
                        </label>
                    </details>
                </fieldset>

                <details class="debug" open>
                    <summary>Event log<span id="logCount" class="msg-count">0</span></summary>
                    <div id="log" class="log"></div>
                    <button id="clearLog" type="button" class="secondary">Clear</button>
                </details>

                <details class="debug">
                    <summary>Window messages<span id="msgCount" class="msg-count">0</span></summary>
                    <div id="msgLog" class="log"></div>
                    <button id="clearMsgLog" type="button" class="secondary">Clear</button>
                </details>

                <details class="debug">
                    <summary>Last API response</summary>
                    <label>
                        <span>portalUrl</span>
                        <textarea id="lastUrl" rows="3" readonly></textarea>
                    </label>
                    <label>
                        <span>raw token</span>
                        <textarea id="lastTokenRaw" rows="3" readonly></textarea>
                    </label>
                </details>

                <details class="debug">
                    <summary>Decoded JWT</summary>
                    <div id="lastTokenDecoded" class="jwt-decoded">
                        <p class="hint">No token yet.</p>
                    </div>
                </details>
                <p id="status" class="status"></p>
            </aside>

            <section class="frame" id="frame">
                <div class="frame-stage" id="frameStage">
                    <iframe id="portal" title="Bring Cashback Portal"></iframe>
                    <div class="resize-handle handle-e" id="resizeE" title="Drag to resize"></div>
                    <div class="resize-handle handle-w" id="resizeW" title="Drag to resize"></div>
                    <div class="resize-handle handle-s" id="resizeS" title="Drag to resize"></div>
                    <div class="resize-handle handle-se" id="resizeSE" title="Drag to resize"></div>
                    <div class="resize-handle handle-sw" id="resizeSW" title="Drag to resize"></div>
                </div>
            </section>
        </main>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
